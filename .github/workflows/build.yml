name: Build YUG SIP Reminder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V21 project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q YUG_SIP_Reminder_V21_GITHUB_BUILD.zip -d build-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: build-src/YUG_SIP_Reminder_Android_Project_V21
        run: gradle --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YUG-SIP-Reminder-V21-debug-apk
          path: build-src/YUG_SIP_Reminder_Android_Project_V21/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
