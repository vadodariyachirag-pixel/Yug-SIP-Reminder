name: Build YUG SIP Reminder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          ls -la
          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract final project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q YUG_SIP_Reminder_FINAL_BUILD.zip -d build-src
          echo "Project extracted successfully"
          find build-src/YUG_SIP_Reminder_Android_Project_V22 -maxdepth 3 -type f -print

      - name: Verify final project
        run: |
          PROJECT="build-src/YUG_SIP_Reminder_Android_Project_V22"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/yugfinancial/sipreminder/MainActivity.java"
          test -f "$PROJECT/app/src/main/assets/index.html"
          echo "Final project files verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build final Debug APK
        working-directory: build-src/YUG_SIP_Reminder_Android_Project_V22
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="build-src/YUG_SIP_Reminder_Android_Project_V22/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK created successfully"
          ls -lh "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: YUG-SIP-Reminder-FINAL-debug-apk
          path: build-src/YUG_SIP_Reminder_Android_Project_V22/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
