name: Build YUG SIP Reminder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V22 project
        run: |
          rm -rf build-src
          mkdir -p build-src

          unzip -q YUG_SIP_Reminder_V22_GITHUB_BUILD.zip -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 3 -type f | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V22 Debug APK
        working-directory: build-src/YUG_SIP_Reminder_Android_Project_V22
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload V22 APK
        uses: actions/upload-artifact@v4
        with:
          name: YUG-SIP-Reminder-V22-debug-apk
          path: build-src/YUG_SIP_Reminder_Android_Project_V22/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
